<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stopwatch</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --text: #e8eaf0;
    --muted: #8a90a0;
    --accent: #4ade80;
    --stop: #f87171;
    --btn: #252a35;
    --btn-hover: #2f3542;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1a1f2b, var(--bg) 70%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 24px;
    padding: 36px 28px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align: center;
  }
  h1 {
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 20px;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
  }
  .running .dot { background: var(--accent); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .time {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: clamp(40px, 13vw, 64px);
    font-weight: 300;
    letter-spacing: 1px;
  }
  .time .ms { font-size: 0.5em; color: var(--muted); }
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin: 28px 0 20px;
  }
  button {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 14px 0;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    background: var(--btn);
    color: var(--text);
    transition: background 0.15s, transform 0.1s;
  }
  button:hover:not(:disabled) { background: var(--btn-hover); }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: default; }
  #startBtn { background: var(--accent); color: #062b14; }
  #startBtn.stop { background: var(--stop); color: #3b0a0a; }
  .laps {
    list-style: none;
    max-height: 220px;
    overflow-y: auto;
    text-align: left;
  }
  .laps li {
    display: flex;
    justify-content: space-between;
    padding: 10px 4px;
    border-top: 1px solid #262b36;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 15px;
  }
  .laps li span:first-child { color: var(--muted); }
  .hint { margin-top: 16px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <h1>Stopwatch</h1>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Stopped</span></div>
    <div class="time" id="display">00:00:00<span class="ms">.00</span></div>
    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="lapBtn" disabled>Lap</button>
      <button id="resetBtn">Reset</button>
    </div>
    <ul class="laps" id="laps"></ul>
    <p class="hint">Space: start/stop · L: lap · R: reset — keeps running even if you close the page</p>
  </div>

<script>
  const KEY = "stopwatch-state-v1";

  // State: startTime (epoch ms when running), elapsed (ms accumulated before current run), laps
  let state = { running: false, startTime: 0, elapsed: 0, laps: [] };

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY));
      if (saved) state = Object.assign(state, saved);
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function currentElapsed() {
    return state.running ? state.elapsed + (Date.now() - state.startTime) : state.elapsed;
  }

  function format(ms) {
    const h = Math.floor(ms / 3600000);
    const m = Math.floor(ms / 60000) % 60;
    const s = Math.floor(ms / 1000) % 60;
    const cs = Math.floor(ms / 10) % 100;
    const p = n => String(n).padStart(2, "0");
    return { main: `${p(h)}:${p(m)}:${p(s)}`, ms: `.${p(cs)}` };
  }

  const display = document.getElementById("display");
  const startBtn = document.getElementById("startBtn");
  const lapBtn = document.getElementById("lapBtn");
  const resetBtn = document.getElementById("resetBtn");
  const lapsEl = document.getElementById("laps");
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("statusText");

  function renderTime() {
    const t = format(currentElapsed());
    display.innerHTML = `${t.main}<span class="ms">${t.ms}</span>`;
    document.title = (state.running ? "▶ " : "") + t.main + " · Stopwatch";
  }

  function renderUI() {
    startBtn.textContent = state.running ? "Stop" : (state.elapsed > 0 ? "Resume" : "Start");
    startBtn.classList.toggle("stop", state.running);
    lapBtn.disabled = !state.running;
    statusEl.classList.toggle("running", state.running);
    statusText.textContent = state.running ? "Running" : (state.elapsed > 0 ? "Paused" : "Stopped");

    lapsEl.innerHTML = "";
    state.laps.slice().reverse().forEach((lap, i) => {
      const n = state.laps.length - i;
      const prev = n > 1 ? state.laps[n - 2] : 0;
      const split = format(lap - prev), total = format(lap);
      const li = document.createElement("li");
      li.innerHTML = `<span>Lap ${n}</span><span>+${split.main}${split.ms}</span><span>${total.main}${total.ms}</span>`;
      lapsEl.appendChild(li);
    });
    renderTime();
  }

  function toggle() {
    if (state.running) {
      state.elapsed = currentElapsed();
      state.running = false;
    } else {
      state.startTime = Date.now();
      state.running = true;
    }
    save(); renderUI();
  }
  function lap() {
    if (!state.running) return;
    state.laps.push(currentElapsed());
    save(); renderUI();
  }
  function reset() {
    state = { running: false, startTime: 0, elapsed: 0, laps: [] };
    save(); renderUI();
  }

  startBtn.addEventListener("click", toggle);
  lapBtn.addEventListener("click", lap);
  resetBtn.addEventListener("click", reset);

  document.addEventListener("keydown", e => {
    if (e.target.tagName === "BUTTON" && e.code === "Space") e.preventDefault();
    if (e.code === "Space") { e.preventDefault(); toggle(); }
    else if (e.key.toLowerCase() === "l") lap();
    else if (e.key.toLowerCase() === "r") reset();
  });

  // Sync if the stopwatch is open in another tab
  window.addEventListener("storage", e => {
    if (e.key === KEY) { load(); renderUI(); }
  });

  function tick() {
    if (state.running) renderTime();
    requestAnimationFrame(tick);
  }

  load();
  renderUI();
  tick();
</script>
</body>
</html>
